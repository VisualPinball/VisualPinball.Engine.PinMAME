name: Build
on: [ push, pull_request ]

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-x86
          - os: macos-latest
            rid: osx
          - os: macos-latest
            rid: ios-arm64
          - os: ubuntu-22.04
            rid: linux-x64
          - os: ubuntu-22.04
            rid: android-arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: |
          cd VisualPinball.Engine.PinMAME
          dotnet build -c Release -r ${{ matrix.rid }}
      - run: |
          mkdir tmp
          cp -r VisualPinball.Engine.PinMAME.Unity/Plugins/${{ matrix.rid }} tmp
      - uses: actions/upload-artifact@v4
        with:
          name: Plugins-${{ matrix.rid }}
          path: tmp

  test:
    name: Test definition conversion
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned machine-definition corpus
        uses: actions/checkout@v4
        with:
          repository: vpinball/pinmame-game-defs
          ref: 4b3c12f776c4355f5dd27b942edf45d933b479b6
          path: pinmame-game-defs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pinmame-game-defs/site/package-lock.json
      - name: Generate the published machine-definition data
        working-directory: pinmame-game-defs/site
        run: |
          npm ci
          npm run data
      - run: dotnet test VisualPinball.Engine.PinMAME.Test/VisualPinball.Engine.PinMAME.Test.csproj --configuration Release
        env:
          PINMAME_GAME_DEFS_ROOT: ${{ github.workspace }}/pinmame-game-defs

  dispatch:
    runs-on: ubuntu-latest
    needs: [ build, test ]
    if: github.repository == 'VisualPinball/VisualPinball.Engine.PinMAME' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          event-type: build-complete
          client-payload: '{"artifacts_run_id": "${{ github.run_id }}"}'
